<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Tareas Diarias</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header__top">
          <h1 class="title">Tareas diarias</h1>
          <div class="chip" id="todayChip" aria-label="Fecha de hoy"></div>
        </div>
        <p class="subtitle">Organiza tu día: agrega, prioriza y marca lo que ya completaste.</p>
      </header>

      <main class="card" role="main">
        <section class="add" aria-label="Agregar tarea">
          <form id="addForm" class="add__form" autocomplete="off">
            <div class="field">
              <label class="label" for="taskTitle">Nueva tarea</label>
              <input id="taskTitle" class="input" type="text" placeholder="Ej: Comprar pan" maxlength="120" required />
            </div>

            <div class="field field--inline">
              <div class="field">
                <label class="label" for="taskDate">Fecha</label>
                <input id="taskDate" class="input" type="date" required />
              </div>

              <div class="field">
                <label class="label" for="taskPriority">Prioridad</label>
                <select id="taskPriority" class="input">
                  <option value="low">Baja</option>
                  <option value="medium" selected>Media</option>
                  <option value="high">Alta</option>
                </select>
              </div>

              <button class="btn btn--primary" type="submit" aria-label="Agregar tarea">Agregar</button>
            </div>
          </form>
        </section>

        <section class="toolbar" aria-label="Buscar y filtrar">
          <div class="toolbar__row">
            <div class="field">
              <label class="label" for="searchInput">Buscar</label>
              <input id="searchInput" class="input" type="search" placeholder="Filtra por texto…" />
            </div>

            <div class="field">
              <label class="label" for="sortSelect">Orden</label>
              <select id="sortSelect" class="input">
                <option value="dateAsc">Fecha (asc)</option>
                <option value="dateDesc" selected>Fecha (desc)</option>
                <option value="priorityDesc">Prioridad</option>
                <option value="createdDesc">Recientes</option>
              </select>
            </div>
          </div>

          <div class="segmented" role="tablist" aria-label="Filtros">
            <button class="segmented__btn" type="button" data-filter="all" role="tab" aria-selected="true">Todas</button>
            <button class="segmented__btn" type="button" data-filter="today" role="tab" aria-selected="false">Hoy</button>
            <button class="segmented__btn" type="button" data-filter="pending" role="tab" aria-selected="false">Pendientes</button>
            <button class="segmented__btn" type="button" data-filter="completed" role="tab" aria-selected="false">Hechas</button>
          </div>
        </section>

        <section class="content" aria-label="Lista de tareas">
          <div class="meta">
            <div class="meta__stats" id="stats"></div>
            <div class="meta__actions">
              <button id="clearCompletedBtn" class="btn btn--ghost" type="button">Borrar hechas</button>
              <button id="resetBtn" class="btn btn--danger" type="button">Reset</button>
            </div>
          </div>

          <ul id="taskList" class="list" aria-label="Tareas"></ul>

          <div id="emptyState" class="empty" hidden>
            <h2 id="emptyTitle" class="empty__title">No hay tareas para mostrar</h2>
            <p id="emptyText" class="empty__text">Prueba agregando una tarea o cambiando los filtros.</p>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span class="footer__hint">Tip: doble click en el título para editar. Enter guarda, Esc cancela.</span>
      </footer>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
